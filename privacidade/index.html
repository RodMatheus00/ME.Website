<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Política de Privacidade — Sistema Pessoal</title>
  <meta http-equiv="refresh" content="0; url=../">
  <style>
    :root {
      --navy: #0b1f3a;
      --blue: #3b82c4;
      --bg: #f4f7fb;
      --text: #1a2433;
      --muted: #5a6a7e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      line-height: 1.6;
    }
    main {
      max-width: 32rem;
      text-align: center;
      background: #fff;
      border: 1px solid #d7e0ec;
      border-radius: 12px;
      padding: 2rem 1.5rem;
      box-shadow: 0 8px 24px rgba(11, 31, 58, 0.08);
    }
    h1 {
      font-size: 1.25rem;
      color: var(--navy);
      margin-bottom: 0.75rem;
    }
    p { color: var(--muted); margin-bottom: 1.25rem; }
    a {
      color: var(--blue);
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    a:focus-visible {
      outline: 3px solid var(--blue);
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Política de Privacidade — Sistema Pessoal</h1>
    <p>Você será redirecionado para a Política de Privacidade.</p>
    <p>
      Se isso não ocorrer automaticamente,
      <a href="../">abra a Política de Privacidade</a>.
    </p>
  </main>
</body>
</html>
